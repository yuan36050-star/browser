server {
    listen 8080;
    absolute_redirect off;

    #AUTH_BASIC auth_basic "browser";
    #AUTH_BASIC auth_basic_user_file /etc/nginx/.htpasswd;

    # 根路径自动跳转到最高画质的 noVNC 界面
    location = / {
        return 301 /vnc.html?quality=9&compression=0;
    }

    # noVNC 画面界面
    location / {
        proxy_pass http://localhost:6080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # MCP 服务
    location /mcp {
        # CORS（配了 CORS_ORIGIN 才生效，见 start.sh）：让浏览器里的网页（如 GitHub Pages 上的 Cove）直连 /mcp。
        # 预检 OPTIONS 在 rewrite 阶段就 204 返回，早于 Basic Auth——浏览器预检从不带凭据。
        #CORS if ($request_method = OPTIONS) {
        #CORS     add_header Access-Control-Allow-Origin "__CORS_ORIGIN__" always;
        #CORS     add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        #CORS     add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
        #CORS     add_header Access-Control-Max-Age 86400 always;
        #CORS     add_header Vary Origin always;
        #CORS     return 204;
        #CORS }
        #CORS add_header Access-Control-Allow-Origin "__CORS_ORIGIN__" always;
        #CORS add_header Access-Control-Expose-Headers "Mcp-Session-Id, WWW-Authenticate" always;
        #CORS add_header Vary Origin always;
        #CORS proxy_hide_header Access-Control-Allow-Origin;
        #CORS proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
